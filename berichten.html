<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Berichten — Dieuw in Thailand</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .berichten-lijst {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }

    .bericht-kaart {
      background: var(--kaart);
      border: 1px solid var(--lijn);
      border-radius: var(--radius);
      box-shadow: var(--schaduw);
      padding: 16px;
      position: relative;
    }

    .bericht-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bericht-naam {
      font-size: 12px;
      font-weight: 700;
      color: var(--moonstone);
      letter-spacing: 0.05em;
    }

    .bericht-datum {
      font-size: 11px;
      color: var(--inkt-zacht);
      margin-left: auto;
      flex-shrink: 0;
    }

    .bericht-verwijder {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--inkt-zacht);
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
      opacity: 0.4;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .bericht-verwijder:hover {
      opacity: 1;
      color: #a4432f;
    }

    .bericht-tekst {
      font-size: 15px;
      line-height: 1.65;
      color: var(--inkt);
      white-space: pre-wrap;
      margin: 0;
    }

    .bericht-foto {
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-top: 12px;
    }

    .bericht-caption {
      font-size: 12px;
      color: var(--inkt-zacht);
      text-align: center;
      font-style: italic;
      margin-top: 6px;
    }

    .berichten-leeg {
      text-align: center;
      padding: 48px 0 32px;
      color: var(--inkt-zacht);
      font-size: 15px;
    }

    .berichten-leeg-emoji {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }

    .berichten-laden {
      text-align: center;
      padding: 40px 0;
      color: var(--inkt-zacht);
      font-size: 14px;
    }

    .plaatsen-sectie { margin-top: 18px; }

    .plaatsen-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--kaart);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: var(--radius);
      box-shadow: var(--schaduw);
      padding: 14px 16px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--moonstone);
      cursor: pointer;
      text-align: left;
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .plaatsen-toggle:hover {
      box-shadow: var(--schaduw-hover);
      transform: translateY(-1px);
    }

    .plaatsen-paneel {
      background: var(--kaart);
      border: 1px solid var(--lijn);
      border-radius: var(--radius);
      box-shadow: var(--schaduw);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 0;
      overflow: hidden;
      padding: 0 16px;
      transition: max-height 0.38s cubic-bezier(.4,0,.2,1), padding 0.38s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }

    .plaatsen-paneel--open {
      max-height: 600px;
      padding: 16px;
      opacity: 1;
      pointer-events: auto;
    }

    .plaatsen-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--inkt-zacht);
      display: grid;
      gap: 6px;
    }

    .plaatsen-input,
    .plaatsen-textarea {
      font: inherit;
      font-size: 15px;
      border: 1.5px solid var(--lijn);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%;
      background: var(--papier);
      color: var(--inkt);
      box-sizing: border-box;
    }

    .plaatsen-textarea { min-height: 90px; resize: vertical; }

    .plaatsen-input:focus,
    .plaatsen-textarea:focus {
      outline: 2px solid var(--moonstone);
      outline-offset: 1px;
      border-color: var(--moonstone);
    }

    .plaatsen-rij { display: flex; gap: 8px; }
    .plaatsen-rij .knop { flex: 1; text-align: center; }

    .dagbericht {
      background-color: #fdf0f4;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><text x='5'  y='28' font-size='22' fill='%23f4a8be' opacity='0.35'>♥</text><text x='48' y='62' font-size='14' fill='%23f4a8be' opacity='0.25'>♥</text><text x='2'  y='72' font-size='9'  fill='%23f0b8cc' opacity='0.22'>♥</text><text x='60' y='14' font-size='9'  fill='%23f0b8cc' opacity='0.22'>♥</text><text x='34' y='10' font-size='7'  fill='%23f4a8be' opacity='0.18'>♥</text><text x='68' y='42' font-size='7'  fill='%23f4a8be' opacity='0.18'>♥</text></svg>");
      background-repeat: repeat;
      border: 1px solid rgba(216, 100, 130, 0.18);
      border-radius: var(--radius);
      padding: 28px 22px 24px;
      margin-top: 18px;
      text-align: center;
      box-shadow: var(--schaduw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dagbericht-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c0466a;
      opacity: 0.6;
    }

    .dagbericht-tekst {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      color: #c0466a;
      margin: 0;
    }

    .dagbericht-van {
      font-size: 12px;
      color: #a06070;
      font-weight: 500;
    }

    .bericht-reacties {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--lijn);
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="eyebrow">DIEUW IN THAILAND</div>
      <h1>💌 Berichten</h1>
    </header>

    <div class="dagbericht" id="dagbericht"></div>

    <div class="plaatsen-sectie" id="plaatsen-sectie">
      <button class="plaatsen-toggle" id="plaatsen-toggle">✏️ Bericht plaatsen</button>
      <form class="plaatsen-paneel" id="post-form">
        <label class="plaatsen-label">Jouw naam
          <input class="plaatsen-input" type="text" id="pl-naam" placeholder="bijv. Mitch" required />
        </label>
        <label class="plaatsen-label">Bericht
          <textarea class="plaatsen-textarea" id="pl-noot" placeholder="Schrijf iets liefs…" required></textarea>
        </label>
        <div class="plaatsen-rij">
          <button class="knop knop--groen" type="submit" id="pl-verstuur">Versturen</button>
        </div>
        <div class="status" id="pl-status"></div>
      </form>
    </div>

    <div class="berichten-lijst" id="berichten-lijst">
      <div class="skel-kaart"><div class="skel-rij"></div><div class="skel-rij skel-rij--midden"></div><div class="skel-rij skel-rij--kort"></div></div>
      <div class="skel-kaart"><div class="skel-rij"></div><div class="skel-rij skel-rij--kort"></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const fmtDatum = new Intl.DateTimeFormat("nl-NL", {
      weekday: "long", day: "numeric", month: "long"
    });

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const EMOJIS = ["❤️", "😂", "🥺", "😍", "🔥"];
    const NAAM_KEY = "berichten-naam";
    let alleReacties = [];

    function mijnNaam() { return localStorage.getItem(NAAM_KEY); }
    function veiligNaam(s) { return String(s).slice(0, 40).replace(/[<>"&]/g, ""); }

    async function laadReacties() {
      try {
        const res = await fetch(
          SUPABASE_URL + "posts?kind=eq.reactie&select=id,naam,note,photo_url",
          { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }
        );
        alleReacties = res.ok ? await res.json() : [];
      } catch { alleReacties = []; }
    }

    function renderReacties(berichtId) {
      const el = document.querySelector(`.bericht-reacties[data-id="${berichtId}"]`);
      if (!el) return;
      const mijn = mijnNaam();
      const rijen = alleReacties.filter(r => r.photo_url === String(berichtId));
      el.innerHTML = EMOJIS.map(emoji => {
        const groep = rijen.filter(r => r.note === emoji);
        const actief = mijn && groep.some(r => r.naam === mijn);
        return `<button class="reactie-knop${actief ? " reactie-knop--actief" : ""}" data-emoji="${emoji}" data-id="${berichtId}">
          ${emoji}${groep.length ? ` <span class="reactie-tel">${groep.length}</span>` : ""}
        </button>`;
      }).join("");
      el.querySelectorAll(".reactie-knop").forEach(k => {
        k.addEventListener("click", () => toggleReactie(berichtId, k.dataset.emoji));
      });
    }

    async function toggleReactie(berichtId, emoji) {
      let naam = mijnNaam();
      if (!naam) {
        naam = prompt("Wie ben jij? (jouw naam voor de reactie)");
        if (!naam || !naam.trim()) return;
        naam = veiligNaam(naam.trim());
        localStorage.setItem(NAAM_KEY, naam);
      }
      const bestaand = alleReacties.find(r =>
        r.photo_url === String(berichtId) && r.note === emoji && r.naam === naam
      );
      if (bestaand) {
        await fetch(SUPABASE_URL + "posts?id=eq." + bestaand.id, {
          method: "DELETE",
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        });
        alleReacties = alleReacties.filter(r => r.id !== bestaand.id);
      } else {
        const res = await fetch(SUPABASE_URL + "posts", {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json", Prefer: "return=representation",
          },
          body: JSON.stringify({ naam, note: emoji, kind: "reactie", photo_url: String(berichtId) }),
        });
        if (res.ok) {
          const data = await res.json();
          if (data?.[0]) alleReacties.push(data[0]);
        }
      }
      renderReacties(berichtId);
    }

    async function laadBerichten() {
      const lijst = document.getElementById("berichten-lijst");
      try {
        const [res] = await Promise.all([
          fetch(
            SUPABASE_URL + "posts?order=created_at.desc&select=*&kind=in.(thuis,reis)",
            { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }
          ),
          laadReacties(),
        ]);
        const berichten = await res.json();

        if (!berichten.length) {
          lijst.innerHTML = `
            <div class="berichten-leeg">
              <span class="berichten-leeg-emoji">💬</span>
              Nog geen berichten
            </div>`;
          return;
        }

        lijst.innerHTML = "";
        for (const b of berichten) {
          const kaart = document.createElement("div");
          kaart.className = "bericht-kaart";
          kaart.dataset.id = b.id;

          let html = `
            <div class="bericht-meta">
              <span class="bericht-naam">${escHtml(b.naam || "Anoniem")}</span>
              <span class="bericht-datum">${fmtDatum.format(new Date(b.created_at))}</span>
              <button class="bericht-verwijder" title="Verwijderen">🗑</button>
            </div>`;

          if (b.note) html += `<p class="bericht-tekst">${escHtml(b.note)}</p>`;
          if (b.photo_url) html += `<img class="bericht-foto" src="${escHtml(b.photo_url)}" alt="${escHtml(b.photo_caption || "")}" loading="lazy">`;
          if (b.photo_caption) html += `<div class="bericht-caption">${escHtml(b.photo_caption)}</div>`;

          html += `<div class="bericht-reacties" data-id="${b.id}"></div>`;

          kaart.innerHTML = html;
          kaart.querySelector(".bericht-verwijder").addEventListener("click", () => verwijder(b.id, kaart));

          lijst.appendChild(kaart);
          renderReacties(b.id);
        }
      } catch (e) {
        lijst.innerHTML = `<div class="leeg">Kon berichten niet laden. Probeer het later opnieuw.</div>`;
      }
    }

    async function verwijder(id, kaart) {
      if (!confirm("Bericht verwijderen?")) return;
      try {
        const res = await fetch(SUPABASE_URL + "posts?id=eq." + id, {
          method: "DELETE",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
          },
        });
        if (!res.ok) throw new Error("status " + res.status);
        kaart.remove();
      } catch (e) {
        alert("Verwijderen mislukt: " + e.message);
      }
    }

    document.getElementById("plaatsen-toggle").addEventListener("click", () => {
      document.getElementById("post-form").classList.toggle("plaatsen-paneel--open");
    });

    document.getElementById("post-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const knop = document.getElementById("pl-verstuur");
      const status = document.getElementById("pl-status");
      knop.disabled = true;
      status.textContent = "Bezig…";
      status.className = "status";

      try {
        const naam = document.getElementById("pl-naam").value.trim();
        const noot = document.getElementById("pl-noot").value.trim();
        if (naam) localStorage.setItem(NAAM_KEY, veiligNaam(naam));

        const res = await fetch(SUPABASE_URL + "posts", {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            Prefer: "return=minimal",
          },
          body: JSON.stringify({ naam, note: noot, kind: "thuis" }),
        });

        if (!res.ok) throw new Error("status " + res.status);

        status.textContent = "Verstuurd! ❤️";
        status.className = "status status--ok";
        document.getElementById("post-form").reset();
        await laadBerichten();
      } catch (err) {
        status.textContent = "Mislukt: " + err.message;
        status.className = "status status--fout";
      } finally {
        knop.disabled = false;
      }
    });

    const DAGBERICHTEN = [
      "Je bent mooi",
      "Je bent knap",
      "Je bent geweldig",
      "Je lacht het mooiste",
      "Je bent zo sterk",
      "Je bent bijzonder",
      "Je maakt me blij",
      "Je bent uniek",
      "Je doet het geweldig",
      "Je bent een schat",
      "Dieuw mijn doedje",
      "Je bent zo lief",
      "Ik ben trots op jou",
      "Je bent prachtig",
      "Je bent mijn prinsesje",
      "Je bent onvervangbaar",
      "Ik wil je knuffelen",
      "Je bent speciaal dieuw!",
      "Je bent de leukste",
      "Je straalt",
    ];

    function toonDagbericht() {
      const el = document.getElementById("dagbericht");
      if (!el) return;
      const nu = new Date();
      const dagVanHetJaar = Math.floor((nu - new Date(nu.getFullYear(), 0, 0)) / 86400000);
      const bericht = DAGBERICHTEN[dagVanHetJaar % DAGBERICHTEN.length];
      el.innerHTML = `
        <div class="dagbericht-label">Bericht van Mitch</div>
        <p class="dagbericht-tekst">${bericht}</p>
        <div class="dagbericht-van">Mitch ❤️</div>`;
    }

    toonDagbericht();
    laadBerichten();
  </script>
</body>
</html>
