name: TikTok Sync

on:
  schedule:
    - cron: '0 9 * * *'  # Dagelijks 09:00 UTC (11:00 Amsterdam)
  workflow_dispatch:       # Ook handmatig te starten

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer yt-dlp en requests
        run: pip install yt-dlp requests

      - name: Sync TikTok clips naar Supabase
        env:
          SUPABASE_URL: https://hprhawqzksknaaaxnzqx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tiktok_sync.py
