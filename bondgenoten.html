<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>de Bondgenoten — Dieuw in Thailand</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="eyebrow">DIEUW IN THAILAND</div>
      <h1>de Bondgenoten</h1>
    </header>

    <nav class="inner-tabs">
      <button class="inner-tab inner-tab--actief" data-tab="tijdlijn">Tijdlijn</button>
      <button class="inner-tab" data-tab="kandidaten">Bondjes</button>
      <button class="inner-tab" data-tab="ranking">Ranking</button>
      <button class="inner-tab" data-tab="clips">📱 Clips</button>
    </nav>

    <main>
      <section id="tab-tijdlijn">
        <div class="kijkbalk" style="margin-top:12px;">
          <a class="knop knop--groen" id="kijklink" href="#" target="_blank" rel="noopener">▶ Kijk de aflevering op KIJK</a>
        </div>
        <p class="vpn-tip">Tip: zet je VPN op een Nederlandse server, anders doet KIJK moeilijk. 🌏</p>
        <div id="tijdlijn" class="tijdlijn">
          <p class="leeg">Laden…</p>
        </div>
      </section>

      <section id="tab-kandidaten" hidden>
        <div id="bondgenoten-lijst"></div>
      </section>

      <section id="tab-ranking" hidden></section>

      <section id="tab-clips" hidden>
        <p class="clips-intro">TikToks van <a href="https://www.tiktok.com/@debondgenoten" target="_blank" rel="noopener">@debondgenoten</a></p>
        <div id="clips-grid" class="clips-grid"><p class="leeg" style="text-align:center;padding:32px 0;">Laden…</p></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/kandidaten.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bondgenoten.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.querySelectorAll(".inner-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".inner-tab").forEach(t => t.classList.remove("inner-tab--actief"));
        tab.classList.add("inner-tab--actief");
        document.querySelectorAll("main > section").forEach(s => s.hidden = true);
        document.getElementById("tab-" + tab.dataset.tab).hidden = false;
        if (tab.dataset.tab === "clips") laadClips();
      });
    });

    function extractTikTokId(url) {
      const m = url.match(/\/video\/(\d+)/);
      return m ? m[1] : null;
    }

    let clipsGeladen = false;

    async function laadClips() {
      if (clipsGeladen) return;
      clipsGeladen = true;

      const grid = document.getElementById("clips-grid");
      try {
        const res = await fetch(
          SUPABASE_URL + "posts?kind=eq.clip&select=note,photo_caption&order=created_at.desc",
          { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }
        );
        const data = await res.json();

        if (!Array.isArray(data) || !data.length) {
          grid.innerHTML = `<p class="leeg" style="text-align:center;padding:32px 0;">Nog geen clips — ze worden hier getoond zodra ze toegevoegd zijn.</p>`;
          return;
        }

        // Groepeer per datum
        const groepen = [];
        let huidigeDatum = null;
        for (const c of data) {
          const datum = c.photo_caption || "";
          if (datum !== huidigeDatum) {
            huidigeDatum = datum;
            groepen.push({ datum, clips: [] });
          }
          groepen[groepen.length - 1].clips.push(c);
        }

        grid.innerHTML = groepen.map(g => {
          const datumHtml = g.datum ? `<div class="clips-datum">${g.datum}</div>` : "";
          const clipsHtml = g.clips.map(c => {
            const id = extractTikTokId(c.note);
            if (!id) return "";
            return `<div class="clip-wrap">
              <blockquote class="tiktok-embed" cite="${c.note}" data-video-id="${id}" style="max-width:605px;min-width:325px;">
                <section></section>
              </blockquote>
            </div>`;
          }).join("");
          return datumHtml + clipsHtml;
        }).join("");

        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.tiktok.com/embed.js";
        document.body.appendChild(script);
      } catch {
        grid.innerHTML = `<p class="leeg" style="text-align:center;padding:32px 0;">Kon clips niet laden.</p>`;
      }
    }
  </script>
</body>
</html>
